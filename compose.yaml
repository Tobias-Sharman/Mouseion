services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: pinakes
      POSTGRES_USER: pinakes
      POSTGRES_PASSWORD: pinakes
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pinakes"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    image: migrate/migrate:v4.18.1
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./db/migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://pinakes:pinakes@db:5432/pinakes?sslmode=disable"
      - "up"
  init-data:
    image: busybox
    command: ["chown", "-R", "65532:65532", "/data"]
    volumes:
      - object-data:/data
  app:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
      init-data:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: "postgres://pinakes:pinakes@db:5432/pinakes?sslmode=disable"
      STORAGE_ROOT: "/data"
      ADDR: ":8080"
    volumes:
      - object-data:/data
    ports:
      - "8080:8080"
volumes:
  db-data:
  object-data:
