- name: Generate cluster CA and certificates
  hosts: localhost
  connection: local
  gather_facts: false
  pre_tasks:
    - name: Read Terraform outputs
      ansible.builtin.command:
        cmd: "terraform -chdir={{ playbook_dir }}/../../terraform output -json"
      register: tf_outputs
      changed_when: false
    - name: Expose apiserver addresses as facts
      ansible.builtin.set_fact:
        apiserver_external_address: "{{ (tf_outputs.stdout | from_json).apiserver_external_address.value }}"
        apiserver_internal_address: "{{ (tf_outputs.stdout | from_json).apiserver_internal_address.value }}"
        apiserver_external_san: "{{ (tf_outputs.stdout | from_json).apiserver_external_san.value }}"
        apiserver_internal_san: "{{ (tf_outputs.stdout | from_json).apiserver_internal_san.value }}"
  roles:
    - ca
    - component-certs
    - apiserver-cert
    - kubelet-certs
