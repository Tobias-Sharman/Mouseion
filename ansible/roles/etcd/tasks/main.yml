- name: Create etcd directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - "{{ etcd_data_dir }}"
    - "{{ etcd_config_dir }}"
- name: Check for existing etcd binary
  ansible.builtin.stat:
    path: "{{ install_dir }}/etcd"
  register: etcd_stat
- name: Download and extract etcd
  ansible.builtin.unarchive:
    src: "https://github.com/etcd-io/etcd/releases/download/v{{ etcd_version }}/etcd-v{{ etcd_version }}-linux-amd64.tar.gz"
    dest: /tmp
    remote_src: true
  when: not etcd_stat.stat.exists
- name: Install etcd binaries
  ansible.builtin.copy:
    src: "/tmp/etcd-v{{ etcd_version }}-linux-amd64/{{ item }}"
    dest: "{{ install_dir }}/{{ item }}"
    mode: "0755"
    remote_src: true
  loop:
    - etcd
    - etcdctl
  when: not etcd_stat.stat.exists
- name: Copy etcd CA and certificate
  ansible.builtin.copy:
    src: "{{ cert_dir }}/{{ item }}"
    dest: "{{ etcd_config_dir }}/{{ item }}"
    mode: "0600"
  loop:
    - etcd-ca.pem
    - etcd.pem
    - etcd-key.pem
  notify: flag etcd restart needed
- name: Template etcd systemd unit
  ansible.builtin.template:
    src: etcd.service.j2
    dest: /etc/systemd/system/etcd.service
    mode: "0644"
  notify:
    - reload etcd systemd
    - flag etcd restart needed
- name: Enable and start etcd
  ansible.builtin.systemd:
    name: etcd
    daemon_reload: true
    enabled: true
    state: started
