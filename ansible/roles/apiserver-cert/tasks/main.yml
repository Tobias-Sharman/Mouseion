- name: Generate API server private key
  community.crypto.openssl_privatekey:
    path: "{{ cert_dir }}/kubernetes-key.pem"
    type: RSA
    size: 2048
    mode: "0600"
- name: Build API server SAN list
  ansible.builtin.set_fact:
    apiserver_sans: "{{ ['DNS:kubernetes', 'DNS:kubernetes.default', 'DNS:kubernetes.default.svc', 'DNS:kubernetes.default.svc.cluster.local', 'DNS:localhost', 'IP:127.0.0.1', 'IP:' + service_cluster_ip, apiserver_internal_san] }}"
- name: Generate API server CSR
  community.crypto.openssl_csr:
    path: "{{ cert_dir }}/kubernetes.csr"
    privatekey_path: "{{ cert_dir }}/kubernetes-key.pem"
    common_name: "kubernetes"
    organization_name: "Kubernetes"
    subject_alt_name: "{{ apiserver_sans }}"
- name: Sign API server certificate with the Kubernetes CA
  community.crypto.x509_certificate:
    path: "{{ cert_dir }}/kubernetes.pem"
    csr_path: "{{ cert_dir }}/kubernetes.csr"
    provider: ownca
    ownca_path: "{{ cert_dir }}/kubernetes-ca.pem"
    ownca_privatekey_path: "{{ cert_dir }}/kubernetes-ca-key.pem"
    ownca_not_after: "+{{ cert_days }}d"
