- name: Create CA directory structure
  ansible.builtin.file:
    path: "{{ cert_dir }}"
    state: directory
    mode: "0700"
- name: Generate CA private key
  community.crypto.openssl_privatekey:
    path: "{{ cert_dir }}/ca-key.pem"
    type: RSA
    size: 4096
    mode: "0600"
- name: Generate CA CSR
  community.crypto.openssl_csr:
    path: "{{ cert_dir }}/ca.csr"
    privatekey_path: "{{ cert_dir }}/ca-key.pem"
    common_name: "{{ cluster_name }}-ca"
    basic_constraints:
      - "CA:TRUE"
    basic_constraints_critical: true
    key_usage:
      - keyCertSign
      - digitalSignature
    key_usage_critical: true
- name: Self-sign the CA certificate
  community.crypto.x509_certificate:
    path: "{{ cert_dir }}/ca.pem"
    privatekey_path: "{{ cert_dir }}/ca-key.pem"
    csr_path: "{{ cert_dir }}/ca.csr"
    provider: selfsigned
    selfsigned_not_after: "+{{ cert_days }}d"
