- name: Download kube-scheduler binary
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/v{{ kube_version }}/bin/linux/amd64/kube-scheduler"
    dest: "{{ install_dir }}/kube-scheduler"
    mode: "0755"
- name: Copy kube-scheduler kubeconfig
  ansible.builtin.copy:
    src: "{{ cert_dir }}/kube-scheduler.kubeconfig"
    dest: "{{ kube_config_dir }}/kube-scheduler.kubeconfig"
    mode: "0600"
- name: Template kube-scheduler config
  ansible.builtin.template:
    src: kube_scheduler_config.yml.j2
    dest: "{{ kube_config_dir }}/kube-scheduler-config.yml"
    mode: "0644"
- name: Template kube-scheduler systemd unit
  ansible.builtin.template:
    src: kube_scheduler.service.j2
    dest: /etc/systemd/system/kube-scheduler.service
    mode: "0644"
  notify: reload kube-scheduler systemd
- name: Enable and start kube-scheduler
  ansible.builtin.systemd:
    name: kube-scheduler
    daemon_reload: true
    enabled: true
    state: started
