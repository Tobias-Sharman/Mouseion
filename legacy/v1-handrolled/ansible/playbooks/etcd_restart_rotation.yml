- name: Restart etcd cluster (one node at a time)
  hosts: controller
  become: true
  gather_facts: false
  serial: 1
  vars:
    etcd_tls_flags: "--cacert=/etc/etcd/etcd-ca.pem --cert=/etc/etcd/etcd.pem --key=/etc/etcd/etcd-key.pem"
  tasks:
    - name: Restart etcd
      ansible.builtin.systemd:
        name: etcd
        state: restarted
    - name: Wait for etcd to report healthy before continuing
      ansible.builtin.command:
        cmd: "etcdctl {{ etcd_tls_flags }} endpoint health"
      register: etcd_health
      until: etcd_health.rc == 0
      retries: 10
      delay: 5
      changed_when: false
- name: Confirm cluster health after rotation
  hosts: controller[0]
  become: true
  gather_facts: false
  vars:
    etcd_tls_flags: "--cacert=/etc/etcd/etcd-ca.pem --cert=/etc/etcd/etcd.pem --key=/etc/etcd/etcd-key.pem"
  tasks:
    - name: Wait for etcd to report healthy
      ansible.builtin.command:
        cmd: "etcdctl {{ etcd_tls_flags }} endpoint health --cluster"
      register: etcd_health
      until: etcd_health.rc == 0
      retries: 15
      delay: 5
      changed_when: false
