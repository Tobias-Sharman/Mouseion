- name: Create CNI plugin directory
  ansible.builtin.file:
    path: /opt/cni/bin
    state: directory
    mode: "0755"
- name: Create containerd config directory
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: "0755"
- name: Check for existing containerd binary
  ansible.builtin.stat:
    path: /usr/local/bin/containerd
  register: containerd_stat
- name: Download and install containerd, runc, and CNI plugins
  when: not containerd_stat.stat.exists
  block:
    - name: Create download staging directory
      ansible.builtin.file:
        path: /tmp/containerd-dist
        state: directory
        mode: "0755"
    - name: Download containerd archive
      ansible.builtin.get_url:
        url: "https://github.com/containerd/containerd/releases/download/v{{ containerd_version }}/containerd-{{ containerd_version }}-linux-{{ binary_arch }}.tar.gz"  # noqa: yaml[line-length]
        dest: /tmp/containerd-dist/containerd.tar.gz
        mode: "0644"
    - name: Download runc
      ansible.builtin.get_url:
        url: "https://github.com/opencontainers/runc/releases/download/v{{ containerd_runc_version }}/runc.{{ binary_arch }}"  # noqa: yaml[line-length]
        dest: /tmp/containerd-dist/runc.{{ binary_arch }}
        mode: "0644"
    - name: Download CNI plugins archive
      ansible.builtin.get_url:
        url: "https://github.com/containernetworking/plugins/releases/download/v{{ containerd_cni_plugins_version }}/cni-plugins-linux-{{ binary_arch }}-v{{ containerd_cni_plugins_version }}.tgz"  # noqa: yaml[line-length]
        dest: /tmp/containerd-dist/cni-plugins.tgz
        mode: "0644"
    - name: Extract containerd
      ansible.builtin.unarchive:
        src: /tmp/containerd-dist/containerd.tar.gz
        dest: /usr/local
        remote_src: true
    - name: Install runc
      ansible.builtin.copy:
        src: /tmp/containerd-dist/runc.{{ binary_arch }}
        dest: /usr/local/sbin/runc
        mode: "0755"
        remote_src: true
    - name: Extract CNI plugins
      ansible.builtin.unarchive:
        src: /tmp/containerd-dist/cni-plugins.tgz
        dest: /opt/cni/bin
        remote_src: true
- name: Generate default containerd config
  ansible.builtin.command: containerd config default
  register: containerd_default_config
  changed_when: false
- name: Write containerd config with systemd cgroup driver enabled
  ansible.builtin.copy:
    content: "{{ containerd_default_config.stdout | regex_replace('SystemdCgroup = false', 'SystemdCgroup = true') }}"
    dest: /etc/containerd/config.toml
    mode: "0644"
  notify: Restart containerd
- name: Template containerd systemd unit
  ansible.builtin.template:
    src: containerd.service.j2
    dest: /etc/systemd/system/containerd.service
    mode: "0644"
  notify: Restart containerd
- name: Enable and start containerd
  ansible.builtin.systemd:
    name: containerd
    daemon_reload: true
    enabled: true
    state: started
