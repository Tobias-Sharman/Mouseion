- name: Pre-seed iptables-persistent debconf answers
  ansible.builtin.debconf:
    name: iptables-persistent
    question: "{{ item }}"
    value: "false"
    vtype: boolean
  loop:
    - iptables-persistent/autosave_v4
    - iptables-persistent/autosave_v6
- name: Install iptables-persistent
  ansible.builtin.apt:
    name: iptables-persistent
    state: present
    update_cache: true
- name: Check for existing NAT masquerade rule for private-subnet internet egress
  ansible.builtin.command: >-
    iptables -t nat -C POSTROUTING -o {{ ansible_facts['default_ipv4']['interface'] }} ! -d {{ vpc_cidr }} -j MASQUERADE
  register: nat_masq_rule_check
  changed_when: false
  failed_when: false
- name: Add NAT masquerade rule for private-subnet internet egress
  ansible.builtin.command: >-
    iptables -t nat -A POSTROUTING -o {{ ansible_facts['default_ipv4']['interface'] }} ! -d {{ vpc_cidr }} -j MASQUERADE
  when: nat_masq_rule_check.rc != 0
  changed_when: true
  notify: Save iptables rules
