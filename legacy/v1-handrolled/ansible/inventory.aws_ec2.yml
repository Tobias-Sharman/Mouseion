plugin: amazon.aws.aws_ec2
regions:
  - eu-west-2
filters:
  "tag:Project": serapeum
keyed_groups:
  - key: ec2_tags.Name
    prefix: ""
    separator: ""
  - key: ec2_tags.Role
    prefix: ""
    separator: ""
compose:
  ansible_host: "(ec2_tags.Role == 'vpn') | ternary(public_ip_address, private_ip_address)"
